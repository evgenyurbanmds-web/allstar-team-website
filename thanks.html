<style>
:root{
  --navy:#0d2f62; --blue:#1463d8; --orange:#f0a22e; --ink:#22344d; --muted:#5b6b84;
  --bg:#f4f8fd; --line:#dbe6f2; --card:#ffffff; --green:#1d9d61;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);line-height:1.55;background:#fff}
img{max-width:100%;height:auto;display:block}
a{color:var(--blue)}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
h1,h2,h3{color:var(--navy);line-height:1.2}
h2{font-size:1.7rem;margin-bottom:.4em}
.sec{padding:52px 0}
.sec-alt{background:var(--bg)}
.sec-sub{color:var(--muted);max-width:640px;margin-bottom:26px}
/* header */
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(13,47,98,.06)}
.hbar{display:flex;align-items:center;gap:16px;padding:10px 0}
.logo{display:flex;align-items:center;text-decoration:none}
.logo img{height:54px;width:auto}
.ig-badge{height:40px;width:auto;vertical-align:middle}
nav.main{margin-left:auto;display:flex;gap:20px;align-items:center}
nav.main a{color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem}
nav.main a:hover{color:var(--blue)}
.btn{display:inline-block;border:none;cursor:pointer;text-decoration:none;font-weight:700;border-radius:10px;padding:12px 20px;font-size:1rem;text-align:center}
.btn-call{background:var(--orange);color:#231600}
.btn-call:hover{filter:brightness(1.06)}
.btn-blue{background:var(--blue);color:#fff}
.btn-ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn-sm{padding:9px 14px;font-size:.92rem}
/* hero */
.hero{background:linear-gradient(180deg,#eaf2fd 0%,#fff 100%);padding:38px 0 46px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center}
.hero h1{font-size:2.35rem;margin:.25em 0 .35em}
.hero .kicker{color:var(--blue);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.82rem}
.hero p.lead{font-size:1.13rem;color:var(--ink);max-width:34em}
.hero .cta-row{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 8px}
.hero .phones-note{color:var(--muted);font-size:.92rem}
.hero-photo img{border-radius:16px;box-shadow:0 12px 32px rgba(13,47,98,.18);width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.rating-badge{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.93rem;box-shadow:0 2px 8px rgba(13,47,98,.07);margin-top:14px}
.stars{color:var(--orange);letter-spacing:.08em}
/* trust bar */
.trust{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}
.trust .wrap{display:flex;flex-wrap:wrap;gap:10px 28px;padding-top:14px;padding-bottom:14px;font-weight:600;color:var(--navy);font-size:.95rem}
.trust span::before{content:"✓ ";color:var(--green);font-weight:800}
/* cards */
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h3{font-size:1.06rem;margin-bottom:.35em}
.card p{color:var(--muted);font-size:.95rem}
.card .from{margin-top:10px;font-weight:700;color:var(--navy)}
.card .from a{font-size:.9rem}
/* prices */
.price-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.price-table th,.price-table td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line)}
.price-table tr:last-child td{border-bottom:none}
.price-table th{background:var(--navy);color:#fff;font-size:.95rem}
.price-table td.price{font-weight:800;color:var(--navy);white-space:nowrap}
.price-note{color:var(--muted);font-size:.92rem;margin-top:12px}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gal img{border-radius:12px;width:100%;height:100%;object-fit:cover;aspect-ratio:3/4}
/* reviews */
.rev-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.rev-score{font-size:2.6rem;font-weight:800;color:var(--navy);line-height:1}
.rev-card .who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.rev-card .name{font-weight:700;color:var(--navy)}
.rev-card .when{color:var(--muted);font-size:.85rem}
.rev-card p{color:var(--ink);font-size:.97rem}
.rev-card .src{color:var(--muted);font-size:.82rem;margin-top:10px}
/* areas */
.areas{display:flex;flex-wrap:wrap;gap:10px}
.areas a,.areas span.chip{border:1.5px solid var(--blue);color:var(--navy);border-radius:999px;padding:9px 18px;text-decoration:none;font-weight:600;background:#fff}
.areas a:hover{background:var(--blue);color:#fff}
.areas span.chip{border-color:var(--line);color:var(--muted)}
/* form */
.form-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 8px 24px rgba(13,47,98,.07)}
.form-card label{display:block;font-weight:600;font-size:.92rem;margin:14px 0 6px;color:var(--navy)}
.form-card input,.form-card select,.form-card textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:1rem;background:#fff;color:var(--ink)}
.form-card input:focus,.form-card select:focus,.form-card textarea:focus{outline:none;border-color:var(--blue)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-ok{display:none;background:#e9f9f1;border:1.5px solid var(--green);color:#0d5c39;border-radius:12px;padding:18px;font-weight:600}
.form-err{display:none;background:#fdecec;border:1.5px solid #d9534f;color:#7a1f1c;border-radius:12px;padding:14px;margin-top:14px;font-size:.94rem}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
/* footer */
footer{background:var(--navy);color:#dbe6f2;padding:42px 0 90px}
footer h3{color:#fff}
footer a{color:#fff}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
footer .small{color:#8ba3c4;font-size:.88rem;margin-top:22px}
/* sticky mobile bar */
.mobile-bar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(13,47,98,.12);padding:8px;gap:8px}
.mobile-bar a{flex:1}
@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr}
  .grid-4,.grid-3{grid-template-columns:repeat(2,1fr)}
  .gal{grid-template-columns:repeat(2,1fr)}
  .fgrid{grid-template-columns:1fr}
  nav.main a:not(.btn){display:none}
  .logo img{height:44px}
  .hero h1{font-size:1.9rem}
  .mobile-bar{display:flex}
  footer{padding-bottom:110px}
}
@media (max-width:520px){
  .grid-4,.grid-3,.grid-2,.form-row{grid-template-columns:1fr}
  .sec{padding:40px 0}
}
</style>
